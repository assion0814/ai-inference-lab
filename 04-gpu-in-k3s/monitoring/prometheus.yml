global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /opt/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'gpu-exporter'
    static_configs:
      - targets: ['127.0.0.1:9400']
        labels:
          instance: 'um890pro'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
