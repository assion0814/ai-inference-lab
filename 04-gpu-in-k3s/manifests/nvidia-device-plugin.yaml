apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        kubernetes.io/hostname: um890pro
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: "system-node-critical"
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
        name: nvidia-device-plugin-ctr
        args:
          - "--device-discovery-strategy=nvml"
          - "--fail-on-init-error=false"
        env:
          - name: LD_LIBRARY_PATH
            value: "/nvidia-libs"
          - name: FAIL_ON_INIT_ERROR
            value: "false"
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: nvlibs
          mountPath: /nvidia-libs
          readOnly: true
        - name: dev-nvidia0
          mountPath: /dev/nvidia0
        - name: dev-nvidiactl
          mountPath: /dev/nvidiactl
        - name: dev-nvidia-uvm
          mountPath: /dev/nvidia-uvm
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: nvlibs
        hostPath:
          path: /home/assion/gpu-k8s/nvidia-libs
          type: Directory
      - name: dev-nvidia0
        hostPath: {path: /dev/nvidia0, type: CharDevice}
      - name: dev-nvidiactl
        hostPath: {path: /dev/nvidiactl, type: CharDevice}
      - name: dev-nvidia-uvm
        hostPath: {path: /dev/nvidia-uvm, type: CharDevice}
