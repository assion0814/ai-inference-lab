apiVersion: v1
kind: Pod
metadata:
  name: gpu-final-test
  namespace: test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: um890pro
  containers:
  - name: cuda
    image: ubuntu:26.04
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        nvidia.com/gpu: 1
    command: ["/bin/bash", "-c"]
    args:
    - |
      echo "=== nvidia-smi (toolkit 注入) ==="
      which nvidia-smi || echo "nvidia-smi not in PATH"
      nvidia-smi 2>&1 | head -20
      echo "=== CUDA version ==="
      nvidia-smi 2>&1 | grep -oE 'CUDA Version: [0-9.]+'
      echo "=== devices ==="
      ls -la /dev/nvidia* 2>&1 | head -8
      echo "=== NVIDIA env ==="
      env | grep -i nvidia
      echo "=== libs ==="
      ldconfig -p 2>/dev/null | grep -i nvidia | head -5
