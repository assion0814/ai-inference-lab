apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "<h1>Node: $NODE_NAME</h1><p>Pod: $POD_NAME</p><p>Arch: $(uname -m)</p>" > /tmp/index.html
          httpd -f -p 8080 -h /tmp
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        - name: POD_NAME
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "50m", memory: "32Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo
spec:
  type: NodePort
  selector:
    app: web-frontend
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
