apiVersion: v1
kind: Pod
metadata:
  name: fix-node
  namespace: default
spec:
  nodeName: orangepi5plus
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  containers:
  - name: fixer
    image: busybox:1.36
    command: ["sleep", "7200"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
